name: Compatibility tests

on: [push, pull_request]

jobs:
  compatibility:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build development environment
        run: make dev
      - name: Verify committed font bytes
        run: git diff --exit-code -- src/pillow_wmf/fonts
      - name: Compare with Windows reference images
        run: make compatibility
