name: Update Windows reference images

on:
  workflow_dispatch:
    inputs:
      reference_set:
        description: "Reference inputs to generate"
        type: choice
        default: all
        options: [all, corpus]
      size:
        description: "Optional new WIDTHxHEIGHT profile; blank updates existing profiles"
        type: string
        default: ""
      probe:
        description: "Optional native probe (all is expensive; explicit approval required)"
        type: choice
        default: none
        options:
          - none
          - mapping
          - precision
          - layout
          - patblt
          - dib-brush
          - paths
          - strokes
          - pen-support
          - ellipse-support
          - polygon-support
          - arcs
          - edge-cases
          - regions
          - region-paint
          - insideframe
          - insideframe-inset
          - roundrects
          - pies
          - chords
          - all
  push:
    branches: [master]
    paths:
      - "test/compatibility/wmf/**/*.wmf"
      - "test/compatibility/wmf/**/*.png"

env:
  REFERENCE_SET: ${{ inputs.reference_set || 'all' }}
  REFERENCE_SIZE: ${{ inputs.size }}

permissions:
  contents: read

concurrency:
  group: update-windows-reference-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      missing: ${{ steps.references.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for missing reference images
        id: references
        shell: bash
        run: |
          root=test/compatibility/wmf
          if [[ "$REFERENCE_SET" == corpus ]]; then root="$root/corpus"; fi
          args=(--root "$root")
          if [[ -n "$REFERENCE_SIZE" ]]; then args+=(--size "$REFERENCE_SIZE"); fi
          python scripts/update-goldens.py --check "${args[@]}"

  update:
    needs: preflight
    if: >-
      needs.preflight.outputs.missing == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.probe != 'none')
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install .
      - name: Report native coordinate mapping
        if: inputs.probe == 'mapping' || inputs.probe == 'all'
        run: python scripts/probe-windows-mapping.py
      - name: Inspect binary-review arithmetic boundaries
        if: inputs.probe == 'precision'
        run: python scripts/probe-windows-precision.py
      - name: Verify native PatBlt
        if: inputs.probe == 'patblt' || inputs.probe == 'all'
        run: python scripts/probe-windows-patblt.py
      - name: Report native layout state
        if: inputs.probe == 'layout'
        run: python scripts/probe-windows-layout.py
      - name: Verify native DIB brushes
        if: inputs.probe == 'dib-brush' || inputs.probe == 'all'
        run: python scripts/probe-windows-dib-brush.py
      - name: Report native drawing paths
        if: inputs.probe == 'paths' || inputs.probe == 'all'
        run: python scripts/probe-windows-paths.py
      - name: Verify native stroke matrix
        if: inputs.probe == 'strokes' || inputs.probe == 'all'
        run: python scripts/probe-windows-strokes.py
      - name: Inspect fractional pen support
        if: inputs.probe == 'pen-support'
        run: python scripts/probe-windows-pen-support.py
      - name: Inspect native ellipse stroke support
        if: inputs.probe == 'ellipse-support'
        run: python scripts/probe-windows-ellipse-support.py
      - name: Inspect native polygon stroke support
        if: inputs.probe == 'polygon-support'
        run: python scripts/probe-windows-polygon-support.py
      - name: Probe native Arc paths
        if: inputs.probe == 'arcs' || inputs.probe == 'all'
        run: python scripts/probe-windows-arcs.py
      - name: Verify native edge cases
        if: inputs.probe == 'edge-cases' || inputs.probe == 'all'
        run: python scripts/probe-windows-edge-cases.py
      - name: Render missing reference images
        if: needs.preflight.outputs.missing == 'true'
        shell: bash
        run: |
          root=test/compatibility/wmf
          if [[ "$REFERENCE_SET" == corpus ]]; then root="$root/corpus"; fi
          args=(--root "$root")
          if [[ -n "$REFERENCE_SIZE" ]]; then args+=(--size "$REFERENCE_SIZE"); fi
          python scripts/update-goldens.py "${args[@]}"
      - name: Verify native regions
        if: inputs.probe == 'regions' || inputs.probe == 'all'
        run: python scripts/probe-windows-regions.py
      - name: Verify native region painting
        if: inputs.probe == 'region-paint' || inputs.probe == 'all'
        run: python scripts/probe-windows-region-paint.py
      - name: Probe native inside-frame paths
        if: inputs.probe == 'insideframe' || inputs.probe == 'all'
        run: python scripts/probe-windows-insideframe.py
      - name: Measure native inside-frame insets
        if: inputs.probe == 'insideframe-inset'
        run: python scripts/probe-windows-insideframe-inset.py
      - name: Probe native RoundRect paths
        if: inputs.probe == 'roundrects' || inputs.probe == 'all'
        run: python scripts/probe-windows-roundrects.py
      - name: Probe native Pie paths
        if: inputs.probe == 'pies' || inputs.probe == 'all'
        run: python scripts/probe-windows-pies.py
      - name: Probe native Chord paths
        if: inputs.probe == 'chords' || inputs.probe == 'all'
        run: python scripts/probe-windows-chords.py
      - name: Commit reference images
        if: needs.preflight.outputs.missing == 'true'
        shell: bash
        run: |
          git add -- ':(glob)test/compatibility/wmf/**/*.png'
          if git diff --cached --quiet; then
            echo "Reference images are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Windows reference images [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
