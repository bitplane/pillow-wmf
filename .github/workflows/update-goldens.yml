name: Update Windows reference images

on:
  workflow_dispatch:
    inputs:
      reference_set:
        description: "Reference inputs to generate"
        type: choice
        default: all
        options: [all, corpus]
      probe:
        description: "Optional named native probe"
        type: choice
        default: none
        options:
          - none
          - record-rejection
          - corpus-rejection
          - corpus-headers
          - corpus-palettes
          - colorrefs
          - mapping
          - precision
          - text
          - symbol
          - mt-extra
          - dbcs
          - dbcs-extended
          - dbcs-spacing
          - codepages
          - text-environments
          - utf8-mac
          - utf8-font
          - real-text
          - text-layout
          - text-styles
          - text-decorations
          - text-quality
          - wingdings
          - wingdings-visual
          - wingdings-metrics
          - text-encoding
          - text-encoding-extended
          - text-options
          - text-placement
          - text-rtl
          - escapes
          - text-missing
          - text-fallback-sizing
          - layout
          - patblt
          - dib-brush
          - dib-boundaries
          - paths
          - strokes
          - pen-support
          - ellipse-support
          - polygon-support
          - arcs
          - edge-cases
          - regions
          - region-paint
          - insideframe
          - insideframe-inset
          - roundrects
          - pies
          - chords
          - emf-frame
          - emf-transforms
          - advanced-paths
          - emf-record
          - pen-widen
          - gradient
          - rotated-paths
          - rotated-pens
          - rotated-strokes
          - emf-layout
          - color-adjustment
          - color-match
          - emf-recording
          - rotated-regions
          - rotated-transfers
          - rotated-blends
          - rotated-wide-pens
          - rotated-pen-styles
          - pen-style-ends
          - angle-arc-turns
          - cosmetic-widen
          - color-engine
          - module-ids
          - color-engine-phase
          - coordinate-limits
          - glyph-transforms
          - compatible-arcs
          - charset-mapping
          - text-samples
          - degenerate-shapes
          - current-position
  push:
    branches: [master]
    paths:
      - "test/compatibility/wmf/**/*.wmf"
      - "test/compatibility/wmf/**/*.png"
      - "test/compatibility/emf/**/*.emf"
      - "test/compatibility/emf/**/*.png"

env:
  REFERENCE_SET: ${{ inputs.reference_set || 'all' }}

permissions:
  contents: read

concurrency:
  group: update-windows-reference-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      missing: ${{ steps.references.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for missing reference images
        id: references
        shell: bash
        run: |
          root=test/compatibility
          if [[ "$REFERENCE_SET" == corpus ]]; then root="$root/wmf/corpus"; fi
          args=(--root "$root" --size 128x128)
          python scripts/update-goldens.py --check "${args[@]}"

  update:
    needs: preflight
    if: >-
      needs.preflight.outputs.missing == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.probe != 'none')
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        id: install
        run: python -m pip install .
      - name: Resolve native probe
        id: probe
        if: github.event_name == 'workflow_dispatch' && inputs.probe != 'none'
        shell: bash
        env:
          PROBE: ${{ inputs.probe }}
        run: python scripts/run-probe.py describe "$PROBE"
      - name: Run native probe
        if: steps.probe.outcome == 'success'
        shell: bash
        env:
          PROBE: ${{ inputs.probe }}
        run: python scripts/run-probe.py run "$PROBE"
      - name: Upload probe observations
        if: >-
          always() && steps.probe.outputs.artifact != '' &&
          (success() || steps.probe.outputs.upload-on-failure == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.probe.outputs.artifact }}
          path: ${{ steps.probe.outputs.artifact }}/
          retention-days: 7
      - name: Render missing reference images
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.preflight.outputs.missing == 'true' }}
        shell: bash
        run: |
          root=test/compatibility
          if [[ "$REFERENCE_SET" == corpus ]]; then root="$root/wmf/corpus"; fi
          args=(--root "$root" --size 128x128)
          python scripts/update-goldens.py "${args[@]}"
      - name: Commit reference images
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.preflight.outputs.missing == 'true' }}
        shell: bash
        run: |
          git add -- ':(glob)test/compatibility/wmf/**/*.png' ':(glob)test/compatibility/emf/**/*.png'
          if git diff --cached --quiet; then
            echo "Reference images are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Windows reference images [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
