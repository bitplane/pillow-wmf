name: Update Windows reference images

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "test/compatibility/wmf/*.wmf"
      - "test/compatibility/wmf/*.png"
      - "scripts/generate-wmf-fixtures.py"
      - "scripts/probe-windows-mapping.py"
      - "scripts/windows_wmf_render.py"
      - "scripts/update-goldens.py"
      - ".github/workflows/update-goldens.yml"

permissions:
  contents: write

concurrency:
  group: update-windows-reference-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install .
      - name: Report native coordinate mapping
        run: python scripts/probe-windows-mapping.py
      - name: Render missing reference images
        run: python scripts/update-goldens.py
      - name: Commit reference images
        shell: bash
        run: |
          git add -- 'test/compatibility/wmf/*.png'
          if git diff --cached --quiet; then
            echo "Reference images are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Windows reference images [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
