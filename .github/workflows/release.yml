name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build dev environment
        run: make dev
      - name: Verify committed font bytes
        run: git diff --exit-code -- src/pillow_wmf/fonts
      - name: Unit and exact compatibility tests
        run: make test-all
      - name: Build distribution
        run: make dist
      - name: Check distribution metadata
        run: .venv/bin/python -m twine check dist/*
      - name: Verify installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/pillow-wmf-wheel"
          "$RUNNER_TEMP/pillow-wmf-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/pillow-wmf-wheel/bin/python" scripts/check-installed-package.py
      - name: Push release
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: make release
