[project]
name = "pillow_wmf"
description = "A Windows MetaFile loader for Pillow"
version = "0.1.0"
authors = [
    { name = "Gareth Davidson", email = "gaz@bitplane.net" }
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "pillow>=12.3"
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "coverage",
    "pytest-cov",
    "build",
    "twine",
    "ruff",
    "pydoc-markdown"
]

[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=3.2,<4"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "compatibility: end-to-end rendering tests against committed native reference output",
]
